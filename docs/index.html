<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hafiz Labs — Audit Reports</title>
<meta name="description" content="Smart contract security audit reports by Hafiz Labs, AI-powered security analysis.">
<style>
  :root{
    --bg:#f7f8fa; --surface:#ffffff; --border:#e3e6ea; --text:#1a1d23; --text-dim:#5b6472; --accent:#3b6fd6;
    --critical:#d1373f;
  }
  @media (prefers-color-scheme: dark){
    :root{ --bg:#14161a; --surface:#1c1f26; --border:#2c313a; --text:#e8eaed; --text-dim:#98a2b3; --accent:#7aa2f7; --critical:#f27171; }
  }
  :root[data-theme="dark"]{ --bg:#14161a; --surface:#1c1f26; --border:#2c313a; --text:#e8eaed; --text-dim:#98a2b3; --accent:#7aa2f7; --critical:#f27171; }
  :root[data-theme="light"]{ --bg:#f7f8fa; --surface:#ffffff; --border:#e3e6ea; --text:#1a1d23; --text-dim:#5b6472; --accent:#3b6fd6; --critical:#d1373f; }
  *{box-sizing:border-box}
  body{margin:0; background:var(--bg); color:var(--text); font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif; line-height:1.55}
  .wrap{max-width:840px; margin:0 auto; padding:40px 20px 80px}
  a{color:var(--accent); text-decoration:none}
  .brand{font-size:14px; color:var(--text-dim); margin-bottom:6px}
  h1{font-size:26px; margin:0 0 6px}
  .subtitle{color:var(--text-dim); margin:0 0 28px}
  .report-list{display:flex; flex-direction:column; gap:12px}
  .report-card{
    display:flex; justify-content:space-between; align-items:center; gap:12px;
    background:var(--surface); border:1px solid var(--border); border-radius:12px; padding:16px 20px;
  }
  .report-card:hover{border-color:var(--accent)}
  .report-id{font-weight:600; font-size:15px}
  .report-meta{color:var(--text-dim); font-size:13px; margin-top:2px}
  .verdict-pill{font-size:12px; font-weight:600; color:var(--critical); white-space:nowrap}
  footer{text-align:center; color:var(--text-dim); font-size:13px; margin-top:40px}
</style>
</head>
<body>
<div class="wrap">
  <div class="brand">🛡️ Hafiz Labs &middot; AI-Powered Security Analysis</div>
  <h1>Audit Reports</h1>
  <p class="subtitle">Public portfolio of smart contract security audits.</p>

  <div class="report-list">
    <p class="subtitle">Belum ada laporan audit yang dipublikasikan.</p>
  </div>

  <footer>
    <p>© 2026 Hafiz Labs. All rights reserved.</p>
  </footer>
</div>
</body>
</html>
